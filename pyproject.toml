[project]
name = "agent-autosuggest-corpus"
version = "0.2.0"
description = "Generates and checks the SFT training corpus for the Auto-Suggest model, kept apart from its eval set; also a Lake library agent"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Orama Search Inc." }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
]

[project.scripts]
agent-autosuggest-corpus = "agent_autosuggest_corpus:main"
agent-autosuggest-corpus-serve = "agent_autosuggest_corpus.service:serve"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
